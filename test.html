<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Test Lápiz</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; overflow:hidden; width:100vw; height:100vh; }
#cnv { position:fixed; top:0; left:0; width:100%; height:100%;
       touch-action:none; display:block; }
#info { position:fixed; top:10px; left:50%; transform:translateX(-50%);
        background:rgba(0,0,0,.8); color:#f0c84a; font-family:monospace;
        font-size:14px; padding:8px 16px; border-radius:4px; text-align:center;
        pointer-events:none; white-space:nowrap; }
#btnclr { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
           padding:12px 28px; background:#c8a44a; border:none; border-radius:4px;
           font-size:16px; font-weight:700; cursor:pointer; color:#111; }
</style>
</head>
<body>
<canvas id="cnv"></canvas>
<div id="info">Dibuje aquí con Apple Pencil o dedo</div>
<button id="btnclr" onclick="ctx.clearRect(0,0,cnv.width,cnv.height)">BORRAR</button>
<script>
var cnv = document.getElementById('cnv');
var ctx = cnv.getContext('2d');
var info = document.getElementById('info');
var drawing = false, lx = 0, ly = 0;
var events = [];

function resize() {
  cnv.width  = window.innerWidth;
  cnv.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 300); });

function dot(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 2, 0, Math.PI*2);
  ctx.fillStyle = '#f0c84a';
  ctx.fill();
}

function seg(x1, y1, x2, y2, w) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = '#f0c84a';
  ctx.lineWidth = w || 3;
  ctx.lineCap = 'round';
  ctx.stroke();
}

// POINTER EVENTS
cnv.addEventListener('pointerdown', function(e) {
  e.preventDefault();
  drawing = true;
  lx = e.clientX; ly = e.clientY;
  cnv.setPointerCapture(e.pointerId);
  dot(lx, ly);
  info.textContent = 'pointer:' + e.pointerType + ' p=' + e.pressure.toFixed(2);
  events.push('pdown');
}, { passive: false });

cnv.addEventListener('pointermove', function(e) {
  e.preventDefault();
  if (!drawing) return;
  var p = e.pressure > 0 ? e.pressure : 0.5;
  seg(lx, ly, e.clientX, e.clientY, 2 + p*5);
  lx = e.clientX; ly = e.clientY;
  info.textContent = 'drawing... type=' + e.pointerType + ' p=' + p.toFixed(2);
}, { passive: false });

cnv.addEventListener('pointerup', function(e) {
  e.preventDefault();
  drawing = false;
  info.textContent = 'pen up — type=' + e.pointerType;
}, { passive: false });

// TOUCH EVENTS fallback
cnv.addEventListener('touchstart', function(e) {
  e.preventDefault();
  e.stopPropagation();
  var t = e.touches[0];
  lx = t.clientX; ly = t.clientY;
  drawing = true;
  dot(lx, ly);
  info.textContent = 'touch start f=' + (t.force||0).toFixed(2);
  events.push('tstart');
}, { passive: false });

cnv.addEventListener('touchmove', function(e) {
  e.preventDefault();
  e.stopPropagation();
  if (!drawing) return;
  var t = e.touches[0];
  var p = t.force || t.webkitForce || 0.5;
  seg(lx, ly, t.clientX, t.clientY, 2 + p*5);
  lx = t.clientX; ly = t.clientY;
  info.textContent = 'touch move f=' + p.toFixed(2);
}, { passive: false });

cnv.addEventListener('touchend', function(e) {
  e.preventDefault();
  drawing = false;
  info.textContent = 'touch end — events: ' + events.join(',');
}, { passive: false });

// MOUSE fallback
cnv.addEventListener('mousedown', function(e) {
  drawing = true; lx = e.clientX; ly = e.clientY;
  info.textContent = 'mouse down';
});
cnv.addEventListener('mousemove', function(e) {
  if (!drawing) return;
  seg(lx, ly, e.clientX, e.clientY, 3);
  lx = e.clientX; ly = e.clientY;
});
cnv.addEventListener('mouseup', function() { drawing = false; });
</script>
</body>
</html>
